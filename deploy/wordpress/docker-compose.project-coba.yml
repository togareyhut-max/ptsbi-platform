# Dibuat oleh deploy-project-coba.sh — project-coba.local

services:
  wordpress-project-coba:
    image: wordpress:6.9.1-php8.2-apache
    container_name: wordpress-project-coba
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_NAME: wp_project_coba
      WORDPRESS_DB_USER: project_coba
      WORDPRESS_DB_PASSWORD: ${PROJECT_COBA_DB_PASS:-PasswordProjectCobaWordpress}
    volumes:
      - wordpress_project_coba:/var/www/html
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.projectcoba.rule=Host(`project-coba.local`) || Host(`www.project-coba.local`)
      - traefik.http.routers.projectcoba.entrypoints=http
      - traefik.http.routers.projectcoba.priority=200
      - traefik.http.routers.projectcoba.service=projectcoba
      - traefik.http.services.projectcoba.loadbalancer.server.port=80

volumes:
  wordpress_project_coba:

networks:
  traefik:
    external: true
