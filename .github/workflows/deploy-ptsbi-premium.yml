name: Deploy ptsbi-premium

on:
  push:
    branches: [main]
    paths:
      - 'wordpress/ptsbi-premium/**'
      - 'wordpress/deploy-plugin-ptsbi.sh'
      - '.github/workflows/deploy-ptsbi-premium.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Ketik DEPLOY untuk mengirim repo ke production (ptsbi.org)'
        required: true
        type: string
      source_branch:
        description: 'Branch sumber plugin (default: main)'
        required: false
        default: 'main'
        type: string

concurrency:
  group: deploy-ptsbi-premium
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Konfirmasi deploy (manual saja)
        if: github.event_name == 'workflow_dispatch' && inputs.confirm != 'DEPLOY'
        run: |
          echo "Deploy dibatalkan. Ketik DEPLOY pada field konfirmasi." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_branch || 'main' }}

      - name: Deploy plugin ke ptsbi.org
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: 5.175.245.78
          PTPRM_SSH_PORT: '22'
        run: bash wordpress/deploy-plugin-ptsbi.sh

      - name: Verifikasi situs live
        run: |
          set -euo pipefail
          EXPECTED="$(grep -oP "define\(\s*'PTPRM_VERSION',\s*'\K[^']+" wordpress/ptsbi-premium/ptsbi-premium.php | head -1)"
          echo "Menunggu cache/CDN (15s)..."
          sleep 15
          CSS_VER="$(curl -fsSL 'https://ptsbi.org/ptsbi-pusat/' | grep -oP 'ptsbi-premium/assets/css/frontend\.css\?ver=\K[0-9.]+' | head -1 || true)"
          BOARD_LINES="$(curl -fsSL 'https://ptsbi.org/ptsbi-pusat/' | grep -o 'ptprm-board-line' | wc -l | tr -d ' ')"
          echo "Plugin CSS ver=${CSS_VER:-?} (harapan ${EXPECTED})"
          echo "Baris pengurus di /ptsbi-pusat/: ${BOARD_LINES}"
          if [[ "${CSS_VER}" != "${EXPECTED}" ]]; then
            echo "::error::Versi plugin di situs (${CSS_VER:-kosong}) tidak sama dengan repo (${EXPECTED}). Deploy ke volume mungkin gagal — cek log SSH." >&2
            exit 1
          fi
          if [[ "${BOARD_LINES}" -lt 5 ]]; then
            echo "::error::Daftar pengurus pusat masih kosong/sedikit (${BOARD_LINES} baris). Cek opsi board_pusat di database." >&2
            exit 1
          fi
          echo "Verifikasi OK."
