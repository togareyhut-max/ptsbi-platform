{% extends "base.html" %}
{% block title %}Ganti Password — Tarombo PTSBI{% endblock %}
{% block content %}
<h2>Ganti Password</h2>
<p class="hint">Akun: <strong>{{ session.get('full_name') }}</strong> ({{ role_label }})</p>
<form method="post" class="form-grid compact">
  <label>Password saat ini<input name="current_password" type="password" required autocomplete="current-password" /></label>
  <label>Password baru<input name="new_password" type="password" required minlength="6" autocomplete="new-password" /></label>
  <label>Ulangi password baru<input name="confirm_password" type="password" required minlength="6" autocomplete="new-password" /></label>
  <div class="actions">
    <button class="btn btn-gold" type="submit">Simpan Password</button>
    <a class="btn btn-dark" href="{{ back_url }}">Batal</a>
  </div>
</form>
{% endblock %}
