services:
  postgres:
    image: postgres:16-alpine
    container_name: tarombo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tarombo
      POSTGRES_PASSWORD: tarombo
      POSTGRES_DB: tarombo_ptsbi
    volumes:
      - tarombo_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarombo -d tarombo_ptsbi"]
      interval: 5s
      timeout: 5s
      retries: 5

  tarombo-app:
    build: .
    container_name: tarombo-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tarombo:tarombo@postgres:5432/tarombo_ptsbi
      SECRET_KEY: ${SECRET_KEY:-ubah-di-production}
      PORT: "5000"
    ports:
      - "5000:5000"

volumes:
  tarombo_pgdata:
