# Tarombo PTSBI — Ubuntu 24.04 (PostgreSQL + Gunicorn)
# Jalankan: docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: tarombo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tarombo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ganti-password-kuat}
      POSTGRES_DB: ${POSTGRES_DB:-tarombo_ptsbi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tarombo} -d ${POSTGRES_DB:-tarombo_ptsbi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: tarombo-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tarombo}:${POSTGRES_PASSWORD:-ganti-password-kuat}@postgres:5432/${POSTGRES_DB:-tarombo_ptsbi}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
